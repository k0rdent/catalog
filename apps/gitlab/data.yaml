title: GitLab
summary: "GitLab self-managed brings the complete DevSecOps lifecycle — source control, CI/CD pipelines, container registry, dependency scanning, DAST, and deployment environments — into a single on-premises application. Running GitLab on k0rdent gives regulated organizations full data sovereignty over their code, ML experiment definitions, and model deployment pipelines."
logo: "./assets/gitlab_logo.svg"
created: "2025-03-18T14:07:09Z"
github_repo: gitlabhq/gitlabhq
description: |
    GitLab helps companies manage the growing complexities of developing, securing, and deploying
    software. By reducing toolchain sprawl, teams on GitLab spend less time maintaining
    tools — equaling 7x faster cycles, better developer productivity, reduced software spend,
    and more time to focus on the features that set your business apart.

why_in_catalog: "Data sovereignty requirements and air-gap constraints mean many regulated organizations cannot use cloud-hosted CI/CD. Running GitLab on k0rdent gives those teams the complete DevSecOps lifecycle — source control, pipelines, container registry, dependency scanning, and deployment environments — on their own infrastructure, with full control over where code, model definitions, and deployment artifacts are stored. For AI teams in healthcare, finance, and government, self-hosted GitLab is often a compliance requirement, not just a preference."
