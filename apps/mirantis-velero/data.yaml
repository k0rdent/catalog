title: "Mirantis Velero"
summary: "Enterprise-supported Velero for backup and disaster recovery."
logo: "https://cdn-images-1.medium.com/max/1600/1*-9mb3AKnKdcL_QD3CMnthQ.png"
created: "2025-07-22T08:16:55Z"
prerequisites: |
  #### Prerequisites
  - k0rdent Enterprise
description: |
    Velero is an open source tool to safely backup and restore, perform disaster recovery,
    and migrate Kubernetes cluster resources and persistent volumes.

why_in_catalog: "Velero is the right tool for Kubernetes backup and disaster recovery. The Mirantis edition exists because operating backup infrastructure at enterprise scale — with guaranteed compatibility across k0rdent versions, validated restore procedures, and an SLA that covers incident response when a restore is needed — requires more than open-source community support can provide. For organizations where data recovery is a contractual obligation rather than a best-effort practice, Mirantis Velero is the version that comes with accountability."
support_type: Enterprise

doc_link: https://vmware-tanzu.github.io/helm-charts/

