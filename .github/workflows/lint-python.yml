name: Python Lint

on:
  push:
    paths:
      - '**/*.py'
      - .github/workflows/lint-python.yml
  pull_request:
    paths:
      - '**/*.py'
      - .github/workflows/lint-python.yml

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Ruff
        # Pin ruff: 0.16.0 expanded the default rule set, which flags a lot of
        # pre-existing repo-wide issues unrelated to any given change. Pin to the
        # last 0.15 release the repo lints clean against; bumping is a separate,
        # deliberate cleanup.
        run: pip install ruff==0.15.22

      - name: Run Ruff
        run: ruff check .
