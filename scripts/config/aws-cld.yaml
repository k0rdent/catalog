apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: CLD_NAME
  namespace: kcm-system
  labels:
    type: aws
    group: demo
spec:
  template: aws-standalone-cp-1-0-43
  credential: aws-credential
  config:
    controlPlane:
      instanceType: AWS_EC2_FAMILY.small
    controlPlaneNumber: 1
    publicIP: false
    region: AWS_REGION
    worker:
      instanceType: AWS_EC2_FAMILY.medium
      rootVolumeSize: 16
    workersNumber: 1
