# Minimal OpenEBS: hostpath localpv default StorageClass, everything else off.
openebs:
  engines:
    local:
      lvm:
        enabled: false
      zfs:
        enabled: false
    replicated:
      mayastor:
        enabled: false
  loki:
    enabled: false
  alloy:
    enabled: false
  localpv-provisioner:
    hostpathClass:
      enabled: true
      isDefaultClass: true
  # Skip VolumeSnapshot CRDs so charts that ship them (e.g. pelagia-ceph) can own them.
  openebs-crds:
    csi:
      volumeSnapshots:
        enabled: false
