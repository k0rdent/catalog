# Minimal OpenEBS values: hostpath localpv as the default StorageClass.
# All other engines (lvm, zfs, mayastor) and observability side-cars are
# disabled to keep the footprint small for k0s-in-docker test clusters.
openebs:
  engines:
    local:
      lvm:
        enabled: false
      zfs:
        enabled: false
    replicated:
      mayastor:
        enabled: false
  loki:
    enabled: false
  alloy:
    enabled: false
  localpv-provisioner:
    hostpathClass:
      enabled: true
      isDefaultClass: true
  # Don't install the CSI VolumeSnapshot CRDs. The hostpath localpv provisioner
  # doesn't need them, and owning them makes helm reject other charts that ship
  # the same CRDs (e.g. pelagia-ceph fails with "cannot be imported into the
  # current release ... current value is openebs"). Leave them to whoever needs
  # them.
  openebs-crds:
    csi:
      volumeSnapshots:
        enabled: false
